# Every PR must pass tests, the authorization matrix, and the security gates.
# Renovate pins every action below to a full commit SHA (helpers:pinGitHubActionDigests).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Migrations are committed
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (tenant isolation, authorization matrix, crypto, audit)
        run: uv run pytest -n auto
      - name: Production settings pass Django's deploy checks
        env:
          DJANGO_SECRET_KEY: ${{ github.run_id }}-ci-only-${{ github.sha }}-not-a-real-secret-value
          CONTROL_DB_USER: ci
          CONTROL_DB_PASSWORD: ci
          CONTROL_DB_HOST: localhost
          FIELD_ENCRYPTION_KMS_KEY_ID: ci
          HEADLESS_JWT_PRIVATE_KEY: ci
          VALKEY_URL: rediss://localhost
          SQS_QUEUE_URL_DEFAULT: ci
          SQS_QUEUE_URL_CRITICAL_PAYMENTS: ci
          SQS_QUEUE_URL_NOTIFICATIONS: ci
          SQS_QUEUE_URL_REPORTS: ci
          FILES_BUCKET: ci
          DJANGO_ALLOWED_HOSTS: api.nexedu.com.gh,.nexedu.com.gh
        run: uv run python manage.py check --deploy --fail-level WARNING --settings=config.settings.prod
      - name: Dependency vulnerabilities
        run: uv run pip-audit --strict --progress-spinner off
      - name: OpenAPI schema
        run: uv run python manage.py spectacular --file openapi.yaml --validate --fail-on-warn
      - uses: actions/upload-artifact@v5
        with:
          name: openapi
          path: backend/openapi.yaml

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high

  # Browser tests: real API + production web build on their own ports and data
  # (web/e2e/servers), including WCAG 2.2 AA checks in light and dark mode.
  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
        working-directory: backend
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: pnpm e2e
        working-directory: web
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Secret scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST (Semgrep)
        run: pipx run semgrep scan --config p/python --config p/django --config p/typescript --config p/react --config p/terraform --error
      - name: OSV dependency scan
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: --recursive ./
      - name: IaC scan (Trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: config
          scan-ref: infra/terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v4

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform/envs/production init -backend=false
      - run: terraform -chdir=infra/terraform/envs/production validate

  image:
    needs: [backend, web, security]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # keyless cosign signing, OIDC to AWS
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -t nexedu/api:${{ github.sha }} backend
      - name: Image vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: nexedu/api:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: nexedu/api:${{ github.sha }}
          format: spdx-json
      # On main: push to ECR via OIDC role, sign with cosign, then deploy.yml
      # runs canary tenant migrations and an ECS blue/green rollout.
